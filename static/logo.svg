<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset=".55" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#FDE7C2"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#042F2E" flood-opacity=".35"/>
    </filter>
    <clipPath id="body"><rect x="24" y="24" width="976" height="976" rx="210"/></clipPath>
  </defs>
  <g>
    <rect x="24" y="24" width="976" height="976" rx="210" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="24" y="24" width="976" height="488.0" fill="url(#gloss)"/>
    <g transform="translate(-94.4 -94.4) scale(1.1845)">
      <!-- swept "floor" arc -->
      <path display="none" d="M180,790 Q470,900 820,720" fill="none" stroke="#CCFBF1" stroke-opacity=".35" stroke-width="22" stroke-linecap="round"/>
      <!-- broom -->
      <g transform="translate(40 -36) rotate(38 512 512)" filter="url(#soft)">
        <rect x="477.0" y="180" width="70" height="410" rx="22" fill="url(#handle)"/>
        <path d="M446,606 L578,606 L652,792 Q656,826 620,828 L404,828 Q368,826 372,792 Z" fill="url(#bristle)"/>
        
        <rect x="436" y="566" width="152" height="58" rx="18" fill="#7C2D12"/>
        <rect x="436" y="584" width="152" height="10" fill="#FDBA74" fill-opacity=".55"/>
      </g>
      <!-- dust -->
      <circle display="none" cx="214" cy="672" r="16" fill="#CCFBF1" fill-opacity=".55"/>
      <circle display="none" cx="170" cy="612" r="10" fill="#CCFBF1" fill-opacity=".4"/>
      <circle display="none" cx="236" cy="590" r="7" fill="#CCFBF1" fill-opacity=".35"/>
      <!-- sparkles: the clean side -->
      <path d="M330,210 C351.6,308.4 351.6,308.4 450,330 C351.6,351.6 351.6,351.6 330,450 C308.4,351.6 308.4,351.6 210,330 C308.4,308.4 308.4,308.4 330,210 Z" fill="#fff"/>
      <path display="none" d="M812,450 C821.0,491.0 821.0,491.0 862,500 C821.0,509.0 821.0,509.0 812,550 C803.0,509.0 803.0,509.0 762,500 C803.0,491.0 803.0,491.0 812,450 Z" fill="#fff" fill-opacity=".9"/>
      <path display="none" d="M478,168 C484.48,197.52 484.48,197.52 514,204 C484.48,210.48 484.48,210.48 478,240 C471.52,210.48 471.52,210.48 442,204 C471.52,197.52 471.52,197.52 478,168 Z" fill="#fff" fill-opacity=".75"/>
    </g>
  </g>
</svg>
