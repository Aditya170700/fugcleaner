[package]
name = "fugcleaner"
version = "0.1.0"
description = "Fug Cleaner — Disk Cleaner for Developers"
authors = ["Aditya"]
edition = "2021"

[lib]
name = "fugcleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = "0.33"
dirs = "6"
rayon = "1.10"
jwalk = "0.8"
trash = "5"
which = "7"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
